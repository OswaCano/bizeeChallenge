
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        user: "${UID:-1000}:${GID:-1000}"
        image: laravel-app
        container_name: bizeeChallenge
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./php.ini:/usr/local/etc/php/conf.d/99-custom.ini
        networks:
            - laravel

    webserver:
        image: nginx:1.25-alpine
        container_name: mi-laravel-web
        depends_on:
            - app
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel

    db:
        image: mysql:8.0
        container_name: mi-laravel-db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: laravel
        ports:
            - "3306:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - laravel

    phpmyadmin:
        depends_on:
            - db
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin
        restart: always
        ports:
            - "8081:80"
        environment:
            PMA_HOST: db
            PMA_USER: laravel
            PMA_PASSWORD: laravel
        networks:
            - laravel

    redis:
        image: redis:7-alpine
        container_name: mi-laravel-redis
        ports:
            - "6379:6379"
        networks:
            - laravel

volumes:
    dbdata:

networks:
    laravel:
        driver: bridge
